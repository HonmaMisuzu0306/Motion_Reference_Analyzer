[project]
name = "motion-reference-analyzer"
version = "1.10.0"
description = "Motion Reference Analyzer Core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=1.10.0,<2",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "av>=19.0.2",
    "opencv-contrib-python==4.10.0.84",
    "opencv-python==4.10.0.84",
    "numpy>=2.0.0",
    "scenedetect>=0.6.0",
    "Pillow>=11.0.0",
    "httpx>=0.27.0",
    "librosa>=0.11,<0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]
ocr = [
    "paddlepaddle==3.3.1",
    "paddleocr==3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "video*", "vision*", "cv*", "ocr*", "recipe*", "schemas*", "db*", "audio*", "projects*", "models*", "selection*"]
