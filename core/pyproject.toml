[project]
name = "motion-reference-analyzer"
version = "0.1.0"
description = "Motion Reference Analyzer Core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "av>=12.0.0",
    "opencv-python>=4.10.0",
    "numpy>=2.0.0",
    "scenedetect[opencv]>=0.6.0",
    "Pillow>=11.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "video*", "vision*", "cv*", "ocr*", "recipe*", "schemas*", "tests*"]
